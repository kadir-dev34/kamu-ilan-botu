name: Kamu İlanları Bot Otomasyonu

on:
  schedule:
    # Her 6 saatte bir otomatik çalışır (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  # İstenildiği an GitHub panelinden elle başlatma imkanı
  workflow_dispatch:

jobs:
  bot-calistir:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Klonla
      uses: actions/checkout@v4

    - name: Python Ortamını Kur
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Bağımlılıkları Yükle
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install supabase requests beautifulsoup4 playwright python-dotenv
        playwright install chromium

    - name: İlan.gov.tr Botunu Çalıştır
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: python ilan_gov_tr_bot.py

    - name: İŞKUR Botunu Çalıştır
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: python iskur_bot.py